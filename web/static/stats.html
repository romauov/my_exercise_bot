<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статистика запросов</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="wrap">
  <header>
    <a href="/" class="ghost back-link">← К графику</a>
    <h1>Статистика запросов</h1>
    <label class="mine-toggle">
      <input type="checkbox" id="show-mine">
      показывать свои
    </label>
  </header>
  <main class="stats-page">
    <section class="chart-card stats-total">
      <span id="total-label" class="stats-total-label">Чужие запросы</span>
      <span id="total-count" class="stats-total-value">—</span>
    </section>
    <section class="chart-card">
      <h2>Запросы по дням</h2>
      <canvas id="stats-chart"></canvas>
    </section>
    <section class="chart-card">
      <h2>Популярные пути</h2>
      <table class="stats-table">
        <thead><tr><th>Путь</th><th>Счёт</th></tr></thead>
        <tbody id="stats-paths"></tbody>
      </table>
      <h2>IP-адреса</h2>
      <table class="stats-table">
        <thead><tr><th>IP</th><th>Счёт</th></tr></thead>
        <tbody id="stats-ips"></tbody>
      </table>
    </section>
    <section class="chart-card">
      <h2>Последние запросы</h2>
      <table class="stats-table">
        <thead><tr><th>Время</th><th>Путь</th><th>Статус</th><th>IP</th></tr></thead>
        <tbody id="stats-log"></tbody>
      </table>
    </section>
  </main>
</div>

<div class="overlay hidden" id="login-overlay">
  <div class="modal">
    <h2>Вход</h2>
    <input type="password" id="token-input" placeholder="Токен" autocomplete="current-password">
    <p id="login-error" class="error hidden">Неверный токен</p>
    <button id="login-btn" class="primary">Войти</button>
  </div>
</div>

<script src="stats.js?v=6"></script>
</body>
</html>
