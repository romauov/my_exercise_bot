services:  
  # Запуск бота приостановлен: сейчас основной интерфейс — сайт контроля веса.
  # Для возврата бота раскомментируйте блок ниже (и `python -m bot` в bot.py).
  # bot:  
  #   build: .  
  #   restart: always  
  #   env_file:  
  #     - .env  
  #   volumes:  
  #     - ./data:/app/data
  #   working_dir: /app

  web:  
    build: .
    restart: always
    env_file:
      - .env
    command: uvicorn web.main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    working_dir: /app